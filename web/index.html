    <main>
      <div class="container">
        <div class="main-content">

            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="./static/purify.min.js"></script>
    <script src="./static/katex/katex.min.js"></script>
    <script src="./static/marked.min.js"></script>
    <script src="./static/marked-katex-extension.js"></script>
